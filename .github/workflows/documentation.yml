name: documentation

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "web/**"
      - "tools/check_docs.py"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "**/*.md"
      - "web/**"
      - "tools/check_docs.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    name: links, claims, metadata, and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run documentation guardrails
        run: python3 tools/check_docs.py
      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.load_file(f) }'
