name: web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "vercel.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "vercel.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Site sanity
        working-directory: web
        run: npm test
