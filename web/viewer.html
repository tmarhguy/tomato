<body>
  <main id="full-screen-viewer">
    <h1 class="vh">Tomato 07_alu — 3D viewer</h1>
    <a class="back" href="index.html">← Back</a>
    <canvas id="viewer-canvas" aria-label="Interactive 3D view of Tomato 07_alu."></canvas>
    <div class="hud">
      <button type="button" class="chip" id="legend-btn" aria-expanded="false">Controls</button>

      <div class="legend legend--desk" id="legend" hidden>
        <p><span>Orbit</span><kbd>Drag</kbd></p>
        <p><span>Zoom</span><kbd>Scroll</kbd></p>
        <p><span>Pan</span><kbd>Right-drag</kbd></p>
        <p><span>Spin</span><kbd>Space</kbd></p>
        <p><span>Top Iso Side Bottom</span><kbd>1 2 3 4</kbd></p>
        <p><span>Reset</span><kbd>R</kbd></p>
        <p><span>Tour</span><kbd>I</kbd></p>
      </div>
      <div class="legend legend--hand" id="legend-hand" hidden>
        <p><span>Orbit</span><kbd>1 finger</kbd></p>
        <p><span>Zoom</span><kbd>Pinch</kbd></p>
        <p><span>Pan</span><kbd>2 fingers</kbd></p>
        <p><span>Spin</span><kbd>Tap</kbd></p>
        <p><span>Reset</span><kbd>Double-tap</kbd></p>
        <p><span>Zoom in</span><kbd>Triple-tap</kbd></p>
      </div>
      <div class="view-bar" id="view-bar">
        <button type="button" data-view="spin" class="is-on">Hold</button>
        <button type="button" data-view="top">Top</button>
        <button type="button" data-view="iso">Iso</button>
        <button type="button" data-view="bottom">Bottom</button>
        <button type="button" data-view="reset">Reset</button>
      </div>
    </div>
    <button type="button" class="immerse" id="immerse" aria-label="Start the board tour">
      <i></i>
      <span>Tour&nbsp;<span class="tour-text">the board</span></span>
    </button>
    <p class="badge">REAL PCB MODEL</p>
    <p class="tour-line" id="tour-line" hidden aria-live="polite">
      <span class="tour-kicker" id="tour-kicker"></span>
      <span class="tour-caption" id="tour-caption"></span>
    </p>
    <p class="tour-hint" id="tour-hint" hidden>Drag or scroll to take over</p>
    <div class="tour-rail" id="tour-rail" hidden>
      <i id="tour-rail-fill"></i>
    </div>
    <div class="boot" id="boot">
      <div class="spin" aria-hidden="true"></div>
      <p id="boot-text">Loading…</p>
    </div>
  </main>
  <script type="module" src="js/viewer.js"></script>
